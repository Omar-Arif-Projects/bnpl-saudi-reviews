# Central configuration for the Tabby and Tamara reviews project.
# All scripts read paths, IDs and parameters from here. No hard-coded values in code.

project:
  random_seed: 42

apps:
  tabby:
    display_name: "Tabby"
    # Verified 2026-11-15: https://play.google.com/store/apps/details?id=app.tabby.client
    # ("Tabby: Send, spend and save"). Not app.tabby.cashier, which is "Tabby Business".
    play_store_id: "app.tabby.client"
    # Verified via itunes.apple.com/lookup (seller: Tabby FZ LLC, bundleId app.tabby.client)
    app_store_id: "1528022364"
  tamara:
    display_name: "Tamara"
    # Verified 2026-11-15: linked from https://tamara.co/en/app (official site)
    play_store_id: "co.tamara.user"
    # Verified via itunes.apple.com/lookup (seller: Tamara FZE, bundleId co.tamara)
    app_store_id: "1533512531"

collection:
  # Store country passed to google-play-scraper. Google Play returns the same
  # reviews for every country, so reviews are not limited to Saudi Arabia.
  country: "sa"
  languages: ["ar", "en"]
  play_store:
    batch_size: 200          # reviews per request (library maximum is ~200)
    sleep_seconds: 1.5       # polite delay between requests
    max_retries: 3
    retry_backoff_seconds: 10
    max_reviews_per_lang: null   # null = everything available; set an int for quick tests
    # Days before the resume point that are read again on each run, so edits
    # and new developer replies are picked up.
    resume_overlap_days: 7
    # Rows collected before this time hold the collecting machine's local time
    # stored as UTC; the cleaning pipeline converts them to UTC.
    legacy_local_time:
      collected_before: "2026-11-16T00:00:00Z"
      timezone: "Asia/Riyadh"
  app_store:
    enabled: true
    max_pages: 10            # Apple RSS exposes at most 10 pages x 50 reviews (recent only)
    sleep_seconds: 1.5

kapsarc:
  # SAMA point-of-sale and mada e-commerce statistics, republished by KAPSARC.
  base_url: "https://data.kapsarc.org/api/explore/v2.1/catalog/datasets"
  dataset_id: "pos-transactions"
  timeout_seconds: 60
  wide_start: "2019-01-01"     # wide monthly file keeps the BNPL era only
  # Raw SAMA indicator name (whitespace-normalized) -> short column name.
  # Columns ending in _m_sar are converted from thousands to millions of SAR.
  indicators:
    "Total POS : Number of Points of Sale Terminals": pos_terminal_count
    "Total POS : Number of Transactions": pos_txn_count
    "Total POS : Sales (In Thousand Riyals)": pos_sales_m_sar
    "E-Commerce Transactions Using Mada Cards : Number of Transactions": ecom_mada_txn_count
    "E-Commerce Transactions Using Mada Cards : Sales (In Thousand Riyals)": ecom_mada_sales_m_sar
    "POS Transactions Using Near Field Communication Technology : Number of Transactions : Cards Transactions": nfc_card_txn_count
    "POS Transactions Using Near Field Communication Technology : Number of Transactions : Mobile Transactions": nfc_mobile_txn_count
    "POS Transactions Using Near Field Communication Technology : Sales (In Thousand Riyals) : Sales Using Cards": nfc_card_sales_m_sar
    "POS Transactions Using Near Field Communication Technology : Sales (In Thousand Riyals) : Sales Using Mobile": nfc_mobile_sales_m_sar

trends:
  # Manual exports from Google Trends Explore; cleaned by src/collect/google_trends.py.
  source: "manual export, Google Trends Explore"
  downloaded_on: "2026-11-15"
  geo: "SA"
  category: "All categories"
  search_property: "Web Search"
  # App key -> search term. All terms are compared in a single query, so the
  # 0-100 index is on a common scale.
  terms:
    tabby: "تابي"
    tamara: "تمارا"
  time_range_in_file: "2018-12-01 to 2026-11-01"
  resolution: "monthly"
  exports:
    - "trends_time.csv (Interest over time)"
    - "trends_region.csv (Interest by subregion, 13 regions)"
  # Excluded: much lower search interest than the Arabic terms in a combined
  # comparison, and ambiguous (common noun / given name).
  excluded_terms: ["Tabby", "Tamara"]

cleaning:
  repeat_max: 2              # maximum run of a repeated character
  min_letters: 2             # minimum Arabic/Latin letters for reviews without emoji
  exclude_from_training: ["emoji_only"]   # language labels with trainable = False
  language:
    mixed_min_share: 0.2     # minimum minority-script share of words for "mixed"
    arabizi_min_tokens: 2    # minimum Arabizi tokens for "arabizi"
    brand_terms: ["tabby", "tamara", "تابي", "تمارا", "تابى"]
    # Arabizi words without digits. Religious and loan phrases common in
    # English text (e.g. "inshallah", "mashallah") are intentionally omitted.
    arabizi_words: [
      "7lw", "7elw", "helw", "hilw", "7lo", "mara", "marra", "wayed", "wajed", "wa9ed",
      "zain", "zein", "zeen", "ya3ni", "yaani", "ya3ny", "bas", "msh",
      "mish", "mo", "mu", "kthir", "kteer", "ktheer", "3ndi", "3endi", "3ala", "3la",
      "hatha", "hadha", "hada", "haza", "tatbeeq", "tatbeq", "barnamaj", "ahsan", "afdal",
      "ana", "enta", "inta", "lil", "ma3", "m3", "7ata", "wala", "lazem", "laazim",
    ]

labels:
  # Weak sentiment labels from star ratings.
  star_to_sentiment: {1: "negative", 2: "negative", 3: "neutral", 4: "positive", 5: "positive"}
  sentiment_classes: ["negative", "neutral", "positive"]
  # Main topic of a review: key -> display name. Used for the hand-labeled gold set.
  topics:
    fees_late_payment: "Fees & late payment"
    approval_limit: "Rejection & credit limit"
    payments_installments: "Payments, installments & card"
    account_verification: "Account, login & verification"
    app_technical: "App bugs & updates"
    customer_service: "Customer service"
    merchant_refund: "Merchants & refunds"
    ease_of_use: "Ease of use & convenience"
    general: "General opinion, no specific topic"
    other: "Other"
  # Row flags in the gold set. Flagged rows are excluded from evaluation;
  # the text of "personal_info" rows is removed when saving.
  flags: ["unclear", "not_about_app", "personal_info"]

gold:
  # Stratified sample for hand labeling: app x language x star group.
  # Negative and neutral reviews are over-sampled; ``weight`` restores
  # population proportions when needed.
  n_total: 400
  source: "google_play"
  languages: ["arabic", "english"]
  star_group_shares: {negative: 0.40, neutral: 0.25, positive: 0.35}
  id_hash_length: 12         # characters of the SHA-256 review-ID hash kept as gold_id
  relabel_n: 50              # rows labeled a second time, blind, to measure consistency

models:
  # Training data: trainable Google Play reviews in these languages, gold set
  # excluded, labeled from star ratings.
  source: "google_play"
  languages: ["arabic", "english", "mixed"]
  dev_share: 0.1             # stratified random hold-out for star-label metrics
  # Balanced comparison sample from the dev split: n per language x sentiment.
  compare_languages: ["arabic", "english"]
  compare_per_cell: 500
  # Language subsets for evaluation: name -> languages (null = all rows).
  eval_subsets: {all: null, arabic: ["arabic"], english: ["english"]}
  baseline:
    char_ngram: [2, 5]       # char_wb n-grams on normalized text
    word_ngram: [1, 2]
    min_df: 3
    max_features_char: 300000
    max_features_word: 100000
    sublinear_tf: true
    C: 1.0
    # One of class_weight_options. Chosen with
    # ``python -m src.models.baseline --compare-class-weights``: the option with
    # the highest macro-F1 on the full dev split (star labels); options within
    # 0.005 of the best are decided by how close the predicted class shares are
    # to the true shares. The gold set is never used for this choice.
    class_weight: "sqrt_balanced"
    class_weight_options: [null, "sqrt_balanced", "balanced"]
    max_iter: 3000
  transformers:
    batch_size: 32
    max_length: 128
    models:
      camelbert:
        name: "CAMeL-Lab/bert-base-arabic-camelbert-da-sentiment"
        revision: "b0df630d23e5aa5f8a326017605337f6d0863ecd"   # Hugging Face commit
        languages: ["arabic"]    # Arabic-only model
      xlmr:
        name: "cardiffnlp/twitter-xlm-roberta-base-sentiment"
        revision: "f2f1202b1bdeb07342385c3f807f9c07cd8f5cf8"   # Hugging Face commit
        languages: ["arabic", "english", "mixed"]
  bootstrap_samples: 1000    # resamples for confidence intervals
  error_analysis:
    length_bins: [3, 10, 30]   # review length groups in words: 1-3, 4-10, 11-30, 31+

topics:
  # BERTopic on Google Play reviews, run separately per star group.
  source: "google_play"
  languages: ["arabic", "english", "mixed"]
  groups: {negative: [1, 2], positive: [4, 5]}
  embedding:
    name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    revision: "e8f8c211226b894fcb81acc59f3b34ba3efd5f42"   # Hugging Face commit
    batch_size: 64
  umap: {n_neighbors: 15, n_components: 5, min_dist: 0.0, metric: "cosine"}
  hdbscan:
    min_cluster_size: {negative: 30, positive: 100}
    min_samples: 10
  # c-TF-IDF keywords: words of letters only, on normalized text. BERTopic
  # applies min_df to one combined document per cluster.
  vectorizer: {ngram_range: [1, 2], min_df: 1}
  top_n_words: 10
  # Unclustered reviews join the most similar cluster if the cosine
  # similarity of their embedding to the cluster's embedding reaches this.
  outlier_similarity: 0.6
  # Naming: a cluster gets the readable topic whose keywords carry the largest
  # share of its top c-TF-IDF weight. A specific topic needs at least
  # min_share; otherwise "general" if its words reach min_share; otherwise
  # "other". Keywords are in normalized form (see src/clean/normalize.py);
  # a trailing * matches any ending, and Arabic words also match after the
  # prefixes in arabic_prefixes.
  min_share: 0.15
  share_languages: ["arabic", "english"]   # languages shown separately in topic shares
  arabic_prefixes: ["وال", "بال", "فال", "كال", "لل", "ال", "و", "ب", "ف", "ل", "ك"]
  keywords:
    fees_late_payment: [
      "رسوم", "رسم", "غرامه", "غرامات", "تاخير", "تاخر", "متاخر*", "فوائد", "فايده", "فائده", "ربا", "عموله*",
      "fee", "fees", "penalt*", "late", "interest", "riba", "usury",
    ]
    approval_limit: [
      "رفض*", "يرفض*", "ترفض*", "مرفوض*", "انرفض*", "ائتمان*", "ائتماني*", "سمه", "موافقه", "يوافق*", "ليمت",
      "limit", "limits", "reject*", "approv*", "eligib*", "simah", "decline", "declined",
    ]
    payments_installments: [
