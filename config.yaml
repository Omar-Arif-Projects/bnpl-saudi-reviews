# Central configuration for the BNPL Saudi reviews project.
# All scripts read paths, IDs and parameters from here. No hard-coded values in code.

project:
  random_seed: 42

apps:
  tabby:
    display_name: "Tabby"
    # Verified 2026-11-15: https://play.google.com/store/apps/details?id=app.tabby.client
    # ("Tabby: Send, spend and save"). Not app.tabby.cashier, which is "Tabby Business".
    play_store_id: "app.tabby.client"
    # Verified via itunes.apple.com/lookup (seller: Tabby FZ LLC, bundleId app.tabby.client)
    app_store_id: "1528022364"
  tamara:
    display_name: "Tamara"
    # Verified 2026-11-15: linked from https://tamara.co/en/app (official site)
    play_store_id: "co.tamara.user"
    # Verified via itunes.apple.com/lookup (seller: Tamara FZE, bundleId co.tamara)
    app_store_id: "1533512531"

collection:
  country: "sa"
  languages: ["ar", "en"]
  play_store:
    batch_size: 200          # reviews per request (library maximum is ~200)
    sleep_seconds: 1.5       # polite delay between requests
    max_retries: 3
    retry_backoff_seconds: 10
    max_reviews_per_lang: null   # null = everything available; set an int for quick tests
  app_store:
    enabled: true
    max_pages: 10            # Apple RSS exposes at most 10 pages x 50 reviews (recent only)
    sleep_seconds: 1.5

kapsarc:
  # SAMA point-of-sale and mada e-commerce statistics, republished by KAPSARC.
  base_url: "https://data.kapsarc.org/api/explore/v2.1/catalog/datasets"
  dataset_id: "pos-transactions"
  timeout_seconds: 60
  wide_start: "2019-01-01"     # wide monthly file keeps the BNPL era only
  # Raw SAMA indicator name (whitespace-normalized) -> short column name.
  # Columns ending in _m_sar are converted from thousands to millions of SAR.
  indicators:
    "Total POS : Number of Points of Sale Terminals": pos_terminal_count
    "Total POS : Number of Transactions": pos_txn_count
    "Total POS : Sales (In Thousand Riyals)": pos_sales_m_sar
    "E-Commerce Transactions Using Mada Cards : Number of Transactions": ecom_mada_txn_count
    "E-Commerce Transactions Using Mada Cards : Sales (In Thousand Riyals)": ecom_mada_sales_m_sar
    "POS Transactions Using Near Field Communication Technology : Number of Transactions : Cards Transactions": nfc_card_txn_count
    "POS Transactions Using Near Field Communication Technology : Number of Transactions : Mobile Transactions": nfc_mobile_txn_count
    "POS Transactions Using Near Field Communication Technology : Sales (In Thousand Riyals) : Sales Using Cards": nfc_card_sales_m_sar
    "POS Transactions Using Near Field Communication Technology : Sales (In Thousand Riyals) : Sales Using Mobile": nfc_mobile_sales_m_sar

trends:
  # MANUAL DOWNLOADS from https://trends.google.com/explore (no API, no scraper).
  # src/collect/google_trends.py only cleans these files.
  source: "manual export, Google Trends Explore"
  downloaded_on: "2026-11-15"
  geo: "SA"                    # Saudi Arabia, whole country
  # App key -> search term exactly as typed. Both terms were compared in ONE
  # query, so the 0-100 index is shared (100 = peak across both).
  terms:
    tabby: "تابي"
    tamara: "تمارا"
  # The time-series export starts at 2018-12-01 with monthly rows and ends at the
  # partial month 2026-11.
  time_range_in_file: "2018-12-01 to 2026-11-01"
  resolution: "monthly"
  # Not stored in the export files; confirmed by Omar from the Trends UI (2026-11-15).
  category: "All categories"
  search_property: "Web Search"
  exports:
    - "trends_time.csv (Interest over time)"
    - "trends_region.csv (Interest by subregion, 13 regions)"
  # English terms ("Tabby", "Tamara") were deliberately NOT used. Omar compared all
  # four terms in one Trends query (2026-11-15): the English names were searched far
  # less than the Arabic ones (visual check; that comparison was not exported).
  # Both English words also have other meanings (a cat breed, a first name).
  excluded_terms: ["Tabby", "Tamara"]

cleaning:
  repeat_max: 2              # حلووووو -> حلوو (keep 2 so emphasis is still visible)
  min_letters: 2             # reviews with fewer letters AND no emoji are dropped ("ok" stays)
  # Kept for EDA but not used to train text models (decision 2026-11-15).
  exclude_from_training: ["emoji_only"]
  language:
    mixed_min_share: 0.2     # smaller script must be >= 20% of words to count as mixed
    arabizi_min_tokens: 2    # Arabizi hits needed, so one "inshallah" stays English
    brand_terms: ["tabby", "tamara", "تابي", "تمارا", "تابى"]
    # Common Gulf Arabizi words (lowercase). Digit spellings (7lw, ya3ni) are
    # caught by pattern; this list adds words written without digits.
    # Phrases English-speaking users also write (mashallah, inshallah,
    # alhamdulillah, shukran, wallah, yalla, khalas) are deliberately NOT listed:
    # they made English reviews look like Arabizi.
    arabizi_words: [
      "7lw", "7elw", "helw", "hilw", "7lo", "mara", "marra", "wayed", "wajed", "wa9ed",
      "zain", "zein", "zeen", "ya3ni", "yaani", "ya3ny", "bas", "msh",
      "mish", "mo", "mu", "kthir", "kteer", "ktheer", "3ndi", "3endi", "3ala", "3la",
      "hatha", "hadha", "hada", "haza", "tatbeeq", "tatbeq", "barnamaj", "ahsan", "afdal",
      "ana", "enta", "inta", "lil", "ma3", "m3", "7ata", "wala", "lazem", "laazim",
    ]

labels:
  # Star rating -> sentiment (weak labels; also used to group reviews in EDA).
  star_to_sentiment: {1: "negative", 2: "negative", 3: "neutral", 4: "positive", 5: "positive"}

eda:
  min_term_count: 30         # a word / bigram must appear this often to be ranked
  top_n_terms: 15
  log_odds_prior: 0.01       # Dirichlet prior strength (share of background counts)
  # Words with no opinion content, in NORMALIZED form (ة->ه, ى->ي, no hamza on alef).
  # English uses scikit-learn's stop-word list plus the extras below.
  stopwords_ar: [
    "في", "من", "علي", "الي", "عن", "مع", "و", "او", "ثم", "ان", "انه", "انها", "لا", "ما",
    "لم", "لن", "هو", "هي", "هم", "انا", "انت", "انتم", "نحن", "هذا", "هذه", "ذلك", "تلك",
    "اللي", "الذي", "التي", "كل", "كان", "كانت", "يكون", "قد", "لقد", "به", "بها", "له", "لها",
    "لي", "لك", "لكم", "لنا", "فيه", "فيها", "عند", "عندي", "حتي", "اذا", "لو", "بس", "يا",
    "هل", "ولا", "وما", "وان", "الا", "بعد", "قبل", "عشان", "لان", "شي", "ايش", "وش",
    "كذا", "كمان", "يعني", "انو", "اني", "منه", "منها", "عليه", "عليها", "وهو", "وهي", "وفي",
    "ومن", "فقط", "ايضا", "جدا", "الله", "تابي", "تمارا", "تطبيق", "التطبيق", "البرنامج", "برنامج",
  ]
  stopwords_en_extra: ["app", "tabby", "tamara", "application", "im", "dont", "it's", "i'm", "don't", "use", "using"]

viz:
  colors: {tabby: "#2a78d6", tamara: "#eb6834"}   # colorblind-checked pair; same in every chart
  surface: "#fcfcfb"
  ink: "#0b0b0b"
  muted: "#52514e"
  grid: "#e1e0d9"
  baseline: "#c3c2b7"

paths:
  raw: "data/raw"
  reviews_clean: "data/processed/reviews_clean.parquet"
  cleaning_log: "reports/cleaning_log.csv"
  processed: "data/processed"
  labeled: "data/labeled"
  external: "data/external"
  figures: "reports/figures"
  events: "data/external/events.csv"
  sama_long: "data/external/sama_pos_ecommerce.csv"
  sama_wide_monthly: "data/external/sama_pos_ecommerce_monthly_wide.csv"
  trends_time_raw: "data/external/trends_time.csv"
  trends_region_raw: "data/external/trends_region.csv"
  trends_time: "data/processed/trends_time.parquet"
  trends_region: "data/processed/trends_region.parquet"
  trends_figure: "reports/figures/trends_interest_over_time.png"
  logs: "logs"
