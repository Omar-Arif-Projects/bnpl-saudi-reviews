      "كود", "توثيق", "تفعيل",
      "account", "accounts", "login", "log", "sign", "signup", "otp", "verif*", "code", "password", "nafath",
      "register*", "registration", "kyc",
    ]
    app_technical: [
      "تحديث", "التحديث", "يفتح", "تفتح", "يشتغل", "يعلق", "شاشه", "بيضاء", "بيضا", "بيضه", "خطا", "تنزيل",
      "تحميل", "النسخه", "اصدار", "لايعمل", "لايفتح", "مايفتح", "بطيء", "بطيئ*", "بطئ",
      "update*", "crash*", "bug", "bugs", "error*", "screen", "white", "blank", "glitch*", "freez*", "stuck",
      "loading", "install", "installed", "installing", "installation", "installations", "version", "lag",
