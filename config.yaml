eda:
  min_term_count: 30         # minimum document frequency for ranked n-grams
  top_n_terms: 15
  log_odds_prior: 0.01       # Dirichlet prior strength relative to background counts
  # Arabic stop words in normalized form. English uses scikit-learn's list plus
  # stopwords_en_extra.
  stopwords_ar: [
    "في", "من", "علي", "الي", "عن", "مع", "و", "او", "ثم", "ان", "انه", "انها", "لا", "ما",
    "لم", "لن", "هو", "هي", "هم", "انا", "انت", "انتم", "نحن", "هذا", "هذه", "ذلك", "تلك",
    "اللي", "الذي", "التي", "كل", "كان", "كانت", "يكون", "قد", "لقد", "به", "بها", "له", "لها",
    "لي", "لك", "لكم", "لنا", "فيه", "فيها", "عند", "عندي", "حتي", "اذا", "لو", "بس", "يا",
    "هل", "ولا", "وما", "وان", "الا", "بعد", "قبل", "عشان", "لان", "شي", "ايش", "وش",
    "كذا", "كمان", "يعني", "انو", "اني", "منه", "منها", "عليه", "عليها", "وهو", "وهي", "وفي",
    "ومن", "فقط", "ايضا", "جدا", "الله", "تابي", "تمارا", "تطبيق", "التطبيق", "البرنامج", "برنامج",
  ]
  stopwords_en_extra: ["app", "tabby", "tamara", "application", "im", "dont", "it's", "i'm", "don't", "use", "using"]
  # Complaint phrases counted in reviews (regular expressions on normalized text).
  complaint_phrases:
    customer_service: 'خدمه العملاء|customer service|customer support|customer care'
    white_screen: 'صفحه بيضا|شاشه بيضا|white screen|blank screen'
    late_fees: 'رسوم التاخير|غرامه|late fee|late payment fee|penalt'
    first_payment: 'الدفعه الاولي|first payment|first installment|down payment'
  # Place names and currencies that indicate a reviewer's country (regular
  # expressions on normalized text). Arabic words may carry a one- or
  # two-letter prefix (و, ب, ل, ف, ك, ال, ...).
  country_markers:
    saudi_arabia: '\b(?:sar|sr|riyals?|ksa|saudi\w*|riyadh|jeddah|nafath|absher|rajhi)\b|\b(?:و|ب|ل|ف|ك|ال|بال|وال|لل|فال)?(?:ريال|سعودي\w*|السعوديه|الرياض|جده|نفاذ|ابشر|الراجحي)\b'
    uae: '\b(?:aed|dirhams?|uae|dubai|abu ?dhabi|sharjah|emirates|emirati)\b|\b(?:و|ب|ل|ف|ك|ال|بال|وال|لل|فال)?(?:درهم|دراهم|الامارات|امارات|اماراتي\w*|دبي|ابوظبي|ابو ظبي|الشارقه)\b'
    kuwait: '\b(?:kwd|kuwait\w*|knet)\b|\b(?:و|ب|ل|ف|ك|ال|بال|وال|لل|فال)?(?:الكويت|كويت\w*|دينار)\b'

